<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login Admin | Room Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{ --bg-app: #fdf8f9; --bg-sidebar: #0a0a0a; --text-main: #2c2a29; --text-muted: #7a7571; --border: #e8e4dc; --primary: #e6a8b1; --primary-hover: #d68f9a; --primary-soft: rgba(230, 168, 177, 0.15); --white: #ffffff; --radius: 12px; --shadow: 0 10px 30px rgba(0,0,0,0.04); }
body{ font-family: var(--sans); background-color: var(--bg-app); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; font-weight: 300; }
.login-container{ background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); width: 100%; max-width: 400px; padding: 3.5rem 2.5rem; text-align: center; }
.logo-circle{ width: 65px; height: 65px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem; overflow:hidden; box-shadow: 0 4px 15px var(--primary-soft); }
.login-title{ font-family: var(--serif); font-size: 1.8rem; font-weight: 500; color: var(--text-main); margin-bottom: 0.3rem; }
.login-subtitle{ font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2.5rem; }
.form-group{ margin-bottom: 1.5rem; text-align: left; }
.form-group label{ display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input{ width: 100%; padding: 0.9rem 1.2rem; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.95rem; color: var(--text-main); background: var(--bg-app); transition: all 0.3s; }
.form-group input:focus{ outline: none; background: var(--white); border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.error-msg{ display:none; background: #fdf5f5; color: #d9534f; padding: 0.8rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.5rem; border: 1px solid #fadcdc; text-align: left; }
.btn-login{ width: 100%; padding: 0.9rem; background: var(--primary); color: var(--white); border: none; border-radius: 30px; font-family: inherit; font-size: 1rem; font-weight: 500; text-transform: uppercase; cursor: pointer; transition: all 0.3s; margin-top: 1rem; }
.btn-login:hover{ background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary-soft); }
.back-link{ display: inline-block; margin-top: 2.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
.back-link:hover{ color: var(--primary); }
</style>
</head>
<body>
<div class="login-container">
  <div class="logo-circle"><img src="image/logo.jpeg" alt="Logo" style="width:100%;height:100%;object-fit:cover;"/></div>
  <h1 class="login-title">Administrator</h1>
  <p class="login-subtitle">Masuk ke sistem manajemen Room Studio</p>
  
  <div class="error-msg" id="error-msg">Email atau password salah.</div>
  
  <form id="login-form">
    <div class="form-group"><label>Email</label><input type="email" id="email" required placeholder="admin@gmail.com" autofocus/></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="••••••••"/></div>
    <button type="submit" class="btn-login" id="btn-login">Masuk ke Sistem</button>
  </form>
  
  <a href="index.html" class="back-link">&larr; Kembali ke Halaman Utama</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient('https://vhsrmfmvblfqolhwgwbt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoc3JtZm12YmxmcW9saHdnd2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2ODQ4NjAsImV4cCI6MjA5MTI2MDg2MH0.jxVo-xAjpEyaqGiROMlWbdwmCga6GKNz_rnNrRYPpWQ');

// Cek apakah sudah login
async function checkSession() {
  const { data } = await db.auth.getSession();
  if (data.session) window.location.href = 'admin.html';
}
checkSession();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-msg');
  btn.disabled = true; btn.textContent = "Memeriksa..."; err.style.display = 'none';

  const { data, error } = await db.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });

  if (error) {
    err.textContent = "Gagal masuk: " + error.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = "Masuk ke Sistem";
  } else {
    window.location.href = 'admin.html';
  }
});
</script>
</body>
</html>
