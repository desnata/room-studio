<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login Admin | Room Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/login.css"/>
</head>
<body>
  <div class="login-container">
  <div class="logo-circle"><img src="image/logo.webp" alt="Logo" style="width:100%;height:100%;object-fit:cover;"/></div>
  <h1 class="login-title">Administrator</h1>
  <p class="login-subtitle">Masuk ke sistem manajemen Room Studio</p>
  
  <div class="error-msg" id="error-msg">Email atau password salah.</div>
  
  <form id="login-form">
    <div class="form-group"><label>Email</label><input type="email" id="email" required placeholder="admin@gmail.com" autofocus/></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="••••••••"/></div>
    <button type="submit" class="btn-login" id="btn-login">Masuk ke Sistem</button>
  </form>
  
  <a href="index.html" class="back-link">&larr; Kembali ke Halaman Utama</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/login.js"></script>
<script src="js/config.js"></script>
</body>
</html>
